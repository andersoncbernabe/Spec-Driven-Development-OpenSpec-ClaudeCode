<div class="page">
  <div class="page-header">
    <h1>Equipes</h1>
    <p>48 seleções participantes da Copa do Mundo FIFA 2026</p>
  </div>

  <div class="toolbar">
    <div class="search-bar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Buscar seleção...">
    </div>
    <div class="filters" id="groupFilter">
      <button class="filter-btn active" data-g="">Todos</button>
      <button class="filter-btn" data-g="A">Grp A</button>
      <button class="filter-btn" data-g="B">Grp B</button>
      <button class="filter-btn" data-g="C">Grp C</button>
      <button class="filter-btn" data-g="D">Grp D</button>
      <button class="filter-btn" data-g="E">Grp E</button>
      <button class="filter-btn" data-g="F">Grp F</button>
      <button class="filter-btn" data-g="G">Grp G</button>
      <button class="filter-btn" data-g="H">Grp H</button>
      <button class="filter-btn" data-g="I">Grp I</button>
      <button class="filter-btn" data-g="J">Grp J</button>
      <button class="filter-btn" data-g="K">Grp K</button>
      <button class="filter-btn" data-g="L">Grp L</button>
    </div>
  </div>

  <div class="team-grid" id="teamGrid"></div>
  <p id="noResult" style="display:none;color:var(--txt-muted);padding:2rem 0">Nenhuma seleção encontrada.</p>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head" id="modalHead"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">Portal<span class="accent">Copa26</span></div>
    <p class="footer-txt">Protótipo · Copa do Mundo FIFA 2026</p>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="jogos.html">Jogos</a>
      <a href="ranking.html">Ranking</a>
      <a href="simulador.html">Simulador</a>
    </div>
  </div>
</footer>

<script src="js/site.js"></script>
<script>
  // Montar lista de equipes com grupo
  function buildTeams() {
    const list = [];
    Object.entries(GRUPOS).forEach(([grupo, g]) => {
      g.teams.forEach(code => {
        const sel = SELECOES[code];
        if (sel) list.push({ code, grupo, ...sel });
      });
    });
    return list.sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
  }

  const TEAMS = buildTeams();
  let filtroGrupo = '';
  let filtroSearch = '';

  function renderGrid() {
    const grid = document.getElementById('teamGrid');
    const noResult = document.getElementById('noResult');
    const filtered = TEAMS.filter(t => {
      const matchG = !filtroGrupo || t.grupo === filtroGrupo;
      const matchS = !filtroSearch || t.nome.toLowerCase().includes(filtroSearch.toLowerCase()) || t.code.toLowerCase().includes(filtroSearch.toLowerCase());
      return matchG && matchS;
    });

    if (!filtered.length) {
      grid.innerHTML = '';
      noResult.style.display = 'block';
      return;
    }
    noResult.style.display = 'none';

    grid.innerHTML = filtered.map(t => `
      <div class="team-card" data-code="${t.code}" role="button" tabindex="0">
        <img src="${FLAG(t.code)}" alt="${t.nome}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="flag-md flag-err" style="display:none">${t.code}</span>
        <div class="team-card-name">${t.nome}</div>
        <div class="team-card-sub">Grupo ${t.grupo} · <span class="badge badge-group" style="font-size:0.6rem">${t.code}</span></div>
      </div>
    `).join('');
  }

  function openModal(code) {
    const t = TEAMS.find(x => x.code === code);
    if (!t) return;
    const rnk = RANKING.find(r => r.code === code);

    document.getElementById('modalHead').innerHTML = `
      <img src="${FLAG(code)}" alt="${t.nome}" onerror="this.style.display='none'">
      <div>
        <h2>${t.nome}</h2>
        <div class="sub">Grupo ${t.grupo} · Técnico: ${t.tecnico}${rnk ? ' · Ranking FIFA #'+rnk.pos : ''}</div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    `;

    const rows = (t.players || []).map(p => `
      <tr>
        <td>${p.nome}</td>
        <td><span class="pos ${posClass(p.pos)}">${p.pos}</span></td>
        <td class="c">${p.idade}</td>
        <td class="c text-gold fw-7">${p.gols}</td>
        <td class="c">${p.copas}</td>
      </tr>
    `).join('');

    document.getElementById('modalBody').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Jogador</th><th>Pos.</th>
            <th class="c">Idade</th>
            <th class="c">Gols</th>
            <th class="c">Copas</th>
          </tr>
        </thead>
        <tbody>${rows || '<tr><td colspan="5" style="color:var(--txt-muted);padding:1rem">Elenco não disponível</td></tr>'}</tbody>
      </table>
    `;

    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('modalClose').addEventListener('click', closeModal);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderGrid();

    // Clique no card
    document.getElementById('teamGrid').addEventListener('click', e => {
      const card = e.target.closest('.team-card');
      if (card) openModal(card.dataset.code);
    });

    // Fechar modal clicando fora
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    });

    // Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // Busca
    document.getElementById('searchInput').addEventListener('input', e => {
      filtroSearch = e.target.value;
      renderGrid();
    });

    // Filtro grupo
    document.getElementById('groupFilter').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('#groupFilter .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtroGrupo = btn.dataset.g;
      renderGrid();
    });
  });
</script>
</body>
</html>
