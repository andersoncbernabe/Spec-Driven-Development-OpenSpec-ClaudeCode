<script src="js/site.js"></script>
<script>
  let filtroGrupo = 'ALL';

  function renderJogos() {
    const lista = filtroGrupo === 'ALL' ? JOGOS : JOGOS.filter(j => j.grupo === filtroGrupo);

    // Ordenar por data+hora e agrupar por data
    lista.sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
    const porData = {};
    lista.forEach(j => {
      if (!porData[j.data]) porData[j.data] = [];
      porData[j.data].push(j);
    });

    const container = document.getElementById('jogosList');
    container.innerHTML = Object.entries(porData)
      .sort(([a],[b]) => a.localeCompare(b))
      .map(([data, jogos]) => `
        <div class="day-group">
          <div class="day-label">
            <h3>${fmtDataLong(data)}</h3>
            <span class="badge badge-next">${jogos.length} jogo${jogos.length > 1 ? 's' : ''}</span>
          </div>
          <div class="game-list">
            ${jogos.map(j => {
              const placar = j.hG !== null ? `${j.hG} : ${j.aG}` : '— : —';
              const status = j.hG !== null
                ? `<span class="badge badge-done">Encerrado</span>`
                : `<span class="badge badge-next">Agendado</span>`;
              return `
                <div class="game-card">
                  <div class="team-side">
                    ${flagImg(j.home,'flag-sm')}
                    <div>
                      <div class="team-name">${SELECOES[j.home]?.nome || j.home}</div>
                      <div class="team-code">${j.home}</div>
                    </div>
                  </div>
                  <div class="game-center">
                    ${status}
                    <div class="game-score">${placar}</div>
                    <div class="game-time">${j.hora} <span class="badge badge-group" style="margin-left:4px">Grp ${j.grupo}</span></div>
                    <div class="game-meta">${j.estadio} · ${j.cidade}</div>
                  </div>
                  <div class="team-side away">
                    ${flagImg(j.away,'flag-sm')}
                    <div>
                      <div class="team-name">${SELECOES[j.away]?.nome || j.away}</div>
                      <div class="team-code">${j.away}</div>
                    </div>
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>
      `).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderJogos();

    document.getElementById('groupFilters').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtroGrupo = btn.dataset.group;
      renderJogos();
    });
  });
</script>
